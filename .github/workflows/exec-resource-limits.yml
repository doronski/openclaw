name: Exec resource limits

on:
  pull_request:
    paths:
      - .github/workflows/exec-resource-limits.yml
      - scripts/plugin-sdk-surface-report.mjs
      - test/scripts/plugin-sdk-surface-report.test.ts
      - extensions/codex/src/app-server/**
      - src/agents/agent-tools.ts
      - src/agents/agent-tools-agent-config.exec.test.ts
      - src/agents/bash-tools.exec*
      - src/config/config.exec-resource-limits.test.ts
      - src/config/schema.help.ts
      - src/config/schema.labels.ts
      - src/config/types.tools.ts
      - src/config/zod-schema.agent-runtime.ts
      - src/cron/service/ops.ts
      - src/cron/service/timer.ts
      - src/cron/service/timer.test.ts
      - src/cron/service.persists-delivered-status.test.ts
      - src/gateway/server-cron.test.ts
      - src/infra/diagnostic-events.ts
      - src/infra/agent-events.ts
      - src/audit/**
      - src/state/openclaw-state-*
      - src/logging/diagnostic-stability*
      - extensions/diagnostics-otel/src/service*
      - src/process/supervisor/**
      - docs/tools/exec.md
  push:
    paths:
      - .github/workflows/exec-resource-limits.yml
      - scripts/plugin-sdk-surface-report.mjs
      - test/scripts/plugin-sdk-surface-report.test.ts
      - extensions/codex/src/app-server/**
      - src/agents/agent-tools.ts
      - src/agents/agent-tools-agent-config.exec.test.ts
      - src/agents/bash-tools.exec*
      - src/config/config.exec-resource-limits.test.ts
      - src/config/schema.help.ts
      - src/config/schema.labels.ts
      - src/config/types.tools.ts
      - src/config/zod-schema.agent-runtime.ts
      - src/cron/service/ops.ts
      - src/cron/service/timer.ts
      - src/cron/service/timer.test.ts
      - src/cron/service.persists-delivered-status.test.ts
      - src/gateway/server-cron.test.ts
      - src/infra/diagnostic-events.ts
      - src/infra/agent-events.ts
      - src/audit/**
      - src/state/openclaw-state-*
      - src/logging/diagnostic-stability*
      - extensions/diagnostics-otel/src/service*
      - src/process/supervisor/**
      - docs/tools/exec.md

permissions:
  contents: read

concurrency:
  group: exec-resource-limits-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENCLAW_VITEST_MAX_WORKERS: "2"
  PNPM_CONFIG_CHILD_CONCURRENCY: "2"
  PNPM_CONFIG_NETWORK_CONCURRENCY: "4"
  OXLINT_THREADS: "2"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "false"
          use-actions-cache: "false"
      - name: Format changed source and retain corrections
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            git -c pack.threads=2 -c pack.windowMemory=128m fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD)
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.md|*.yml) files+=("$file") ;;
            esac
          done
          if ((${#files[@]})); then
            pnpm exec oxfmt --write --threads=1 -- "${files[@]}"
          fi
          git diff --binary > /tmp/exec-resource-limits-format.patch
      - name: Focused regression tests
        run: >-
          pnpm test
          src/process/supervisor/adapters/systemd-user.test.ts
          src/audit/audit-events.test.ts
          src/infra/agent-events.test.ts
          src/state/openclaw-state-db.test.ts
          src/process/supervisor/supervisor.test.ts
          src/agents/bash-tools.exec-runtime.test.ts
          src/agents/bash-tools.exec-host-gateway.test.ts
          src/agents/bash-tools.exec.security-floor.test.ts
          src/agents/agent-tools-agent-config.exec.test.ts
          src/config/config.exec-resource-limits.test.ts
          src/cron/service.persists-delivered-status.test.ts
          src/cron/service.failure-alert.test.ts
          src/cron/service/timer.test.ts
          src/cron/service/timer.regression.test.ts
          src/gateway/server-cron.test.ts
          src/gateway/server-cron-notifications.test.ts
          src/logging/diagnostic-stability.test.ts
          extensions/diagnostics-otel/src/service.test.ts
          extensions/codex/src/app-server/dynamic-tool-build.test.ts
          extensions/codex/src/app-server/native-execution-policy.test.ts
          extensions/codex/src/app-server/thread-lifecycle.test.ts
          extensions/codex/media-understanding-provider.test.ts
          extensions/codex/src/web-search-provider.test.ts
          test/scripts/plugin-sdk-surface-report.test.ts
      - name: Plugin SDK surface budgets
        run: pnpm plugin-sdk:surface:check
      - name: Core type checks
        if: ${{ !cancelled() }}
        run: pnpm tsgo:core
      - name: Plugin type checks
        if: ${{ !cancelled() }}
        run: pnpm tsgo:extensions
      - name: Core test type checks
        if: ${{ !cancelled() }}
        run: pnpm tsgo:core:test
      - name: Plugin test type checks
        if: ${{ !cancelled() }}
        run: pnpm tsgo:extensions:test
      - name: Lint changed core and plugin files
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            git -c pack.threads=2 -c pack.windowMemory=128m fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          mapfile -d '' changed < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts')
          core=()
          plugins=()
          for file in "${changed[@]}"; do
            case "$file" in
              src/*) core+=("$file") ;;
              extensions/*) plugins+=("$file") ;;
            esac
          done
          if ((${#core[@]})); then
            node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.core.json "${core[@]}"
          fi
          if ((${#plugins[@]})); then
            node scripts/run-oxlint.mjs --tsconfig config/tsconfig/oxlint.extensions.json "${plugins[@]}"
          fi
      - name: Require committed formatting
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - name: Upload formatting corrections
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exec-resource-limits-format
          path: /tmp/exec-resource-limits-format.patch
          if-no-files-found: ignore
          retention-days: 3

  package:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source-commit: ${{ steps.source.outputs.commit }}
      core-artifact-id: ${{ steps.upload-core.outputs.artifact-id }}
      core-artifact-digest: ${{ steps.upload-core.outputs.artifact-digest }}
      core-package-name: ${{ steps.core-package.outputs.name }}
      core-package-sha256: ${{ steps.core-package.outputs.sha256 }}
      codex-artifact-id: ${{ steps.upload-codex.outputs.artifact-id }}
      codex-artifact-digest: ${{ steps.upload-codex.outputs.artifact-digest }}
      codex-package-name: ${{ steps.codex-package.outputs.name }}
      codex-package-sha256: ${{ steps.codex-package.outputs.sha256 }}
    env:
      NODE_OPTIONS: --max-old-space-size=16384
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record the actual package producer checkout
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.x
          install-bun: "true"
          use-actions-cache: "false"
      - name: Build and validate core package through the maintained package workflow
        id: core-package
        run: |
          set -euo pipefail
          node scripts/package-openclaw-for-docker.mjs \
            --output-dir .artifacts/exec-resource-limits/core \
            --pack-json .artifacts/exec-resource-limits/core-pack.json
          packages=(.artifacts/exec-resource-limits/core/*.tgz)
          test "${#packages[@]}" -eq 1
          printf 'name=%s\nsha256=%s\n' "$(basename "${packages[0]}")" \
            "$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload exact-source core candidate
        id: upload-core
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exec-resource-limits-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .artifacts/exec-resource-limits/core/*.tgz
            .artifacts/exec-resource-limits/core-pack.json
            dist/build-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Build and pack the separate Codex plugin without publishing
        id: codex-package
        env:
          OPENCLAW_PLUGIN_NPM_PACK_OUTPUT_DIR: .artifacts/exec-resource-limits/codex
        run: |
          set -euo pipefail
          bash scripts/plugin-npm-publish.sh --pack extensions/codex
          packages=(.artifacts/exec-resource-limits/codex/*.tgz)
          test "${#packages[@]}" -eq 1
          printf 'name=%s\nsha256=%s\n' "$(basename "${packages[0]}")" \
            "$(sha256sum "${packages[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload exact-source Codex candidate
        id: upload-codex
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exec-resource-limits-codex-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/exec-resource-limits/codex/*.tgz
          if-no-files-found: error
          retention-days: 7

  arm64-package-smoke:
    needs: package
    if: github.repository == 'doronski/openclaw'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.package.outputs.source-commit }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts
      - name: Download and verify this run's producer-bound package artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_COMMIT: ${{ needs.package.outputs.source-commit }}
          WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CORE_ARTIFACT_ID: ${{ needs.package.outputs.core-artifact-id }}
          CORE_ARTIFACT_DIGEST: ${{ needs.package.outputs.core-artifact-digest }}
          CORE_PACKAGE_NAME: ${{ needs.package.outputs.core-package-name }}
          CORE_PACKAGE_SHA256: ${{ needs.package.outputs.core-package-sha256 }}
          CODEX_ARTIFACT_ID: ${{ needs.package.outputs.codex-artifact-id }}
          CODEX_ARTIFACT_DIGEST: ${{ needs.package.outputs.codex-artifact-digest }}
          CODEX_PACKAGE_NAME: ${{ needs.package.outputs.codex-package-name }}
          CODEX_PACKAGE_SHA256: ${{ needs.package.outputs.codex-package-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCER_COMMIT"
          git diff --exit-code -- scripts
          artifact_root="$RUNNER_TEMP/openclaw-arm64-packages"
          mkdir -m 700 "$artifact_root"
          while read -r kind artifact_id zip_sha; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$artifact_root/$kind.json"
            jq -e --argjson id "$artifact_id" --arg digest "sha256:$zip_sha" \
              --argjson run "$GITHUB_RUN_ID" --arg head "$WORKFLOW_HEAD" '
              .id == $id and .expired == false and .digest == $digest and
              .workflow_run.id == $run and .workflow_run.head_sha == $head
            ' "$artifact_root/$kind.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$artifact_root/$kind.zip"
            printf '%s  %s\n' "$zip_sha" "$artifact_root/$kind.zip" | sha256sum --check
            unzip -q "$artifact_root/$kind.zip" -d "$artifact_root/$kind"
          done < <(printf '%s %s %s\n' \
            core "$CORE_ARTIFACT_ID" "$CORE_ARTIFACT_DIGEST" \
            codex "$CODEX_ARTIFACT_ID" "$CODEX_ARTIFACT_DIGEST")
          core_tgz="$artifact_root/core/.artifacts/exec-resource-limits/core/$CORE_PACKAGE_NAME"
          codex_tgz="$artifact_root/codex/$CODEX_PACKAGE_NAME"
          printf '%s  %s\n' \
            "$CORE_PACKAGE_SHA256" "$core_tgz" "$CODEX_PACKAGE_SHA256" "$codex_tgz" \
            | sha256sum --check
          jq -e --arg commit "$PRODUCER_COMMIT" '.commit == $commit' \
            "$artifact_root/core/dist/build-info.json"
          printf 'core-tgz=%s\ncodex-tgz=%s\n' "$core_tgz" "$codex_tgz" >> "$GITHUB_OUTPUT"
      - name: Qualify core and separate Codex package without a model turn
        env:
          CORE_TGZ: ${{ steps.artifacts.outputs.core-tgz }}
          CODEX_TGZ: ${{ steps.artifacts.outputs.codex-tgz }}
          CORE_PACKAGE_SHA256: ${{ needs.package.outputs.core-package-sha256 }}
          CODEX_PACKAGE_SHA256: ${{ needs.package.outputs.codex-package-sha256 }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/openclaw-arm64-evidence"
          container="openclaw-arm64-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$evidence"
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            docker stop --time 5 "$container" >> "$evidence/cleanup.log" 2>&1
            docker inspect --format \
              '{"state":{{json .State}},"memory":{{.HostConfig.Memory}},"memorySwap":{{.HostConfig.MemorySwap}},"pidsLimit":{{.HostConfig.PidsLimit}},"networkMode":{{json .HostConfig.NetworkMode}},"mounts":{{json .Mounts}}}' \
              "$container" > "$evidence/container.json"
            docker rm -f "$container" >> "$evidence/cleanup.log" 2>&1
            cleanup_status=$?
            if docker inspect "$container" >/dev/null 2>&1; then cleanup_status=1; fi
            if [ "$status" -eq 0 ]; then status=$cleanup_status; fi
            exit "$status"
          }
          trap cleanup EXIT
          docker pull --platform linux/arm64 node:22.22.3-bookworm-slim
          image_id="$(docker image inspect --format '{{.Id}}' node:22.22.3-bookworm-slim)"
          docker image inspect --format '{{json .RepoDigests}}' "$image_id" > "$evidence/image.json"
          timeout --kill-after=5s 210s docker run --name "$container" --init \
            --platform linux/arm64 --memory 2g --memory-swap 2g --cpus 2 \
            --pids-limit 256 --stop-timeout 5 --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts,dst=/harness/scripts,readonly" \
            --mount "type=bind,src=$CORE_TGZ,dst=/tmp/openclaw-current.tgz,readonly" \
            --mount "type=bind,src=$CODEX_TGZ,dst=/tmp/openclaw-codex.tgz,readonly" \
            --mount "type=bind,src=$evidence,dst=/evidence" \
            --env HOME=/tmp/openclaw-home --env OPENCLAW_HOME=/tmp/openclaw-home \
            --env OPENCLAW_STATE_DIR=/tmp/openclaw-home/.openclaw \
            --env OPENCLAW_CONFIG_PATH=/tmp/openclaw-home/.openclaw/openclaw.json \
            --env OPENCLAW_CURRENT_PACKAGE_TGZ=/tmp/openclaw-current.tgz \
            --env "CORE_PACKAGE_SHA256=$CORE_PACKAGE_SHA256" --env "CODEX_PACKAGE_SHA256=$CODEX_PACKAGE_SHA256" \
            --env OPENCLAW_E2E_NPM_INSTALL_TIMEOUT=180s --env NPM_CONFIG_USERCONFIG=/dev/null \
            --env OPENCLAW_DISABLE_BONJOUR=1 --env CI=true \
            --workdir /harness -i "$image_id" timeout --kill-after=5s 180s bash -s \
            > "$evidence/container.stdout" 2> "$evidence/container.stderr" <<'SMOKE'
          set -euo pipefail
          printf '%s  %s\n' "$CORE_PACKAGE_SHA256" /tmp/openclaw-current.tgz \
            "$CODEX_PACKAGE_SHA256" /tmp/openclaw-codex.tgz | sha256sum --check
          test "$(uname -m)" = aarch64
          test "$(node --version)" = v22.22.3
          uname -m
          node --version
          mkdir -p "$HOME" "$OPENCLAW_STATE_DIR"
          source scripts/lib/openclaw-e2e-instance.sh
          openclaw_e2e_install_package /evidence/core-install.log "same-run core package" /tmp/openclaw-proof
          export PATH="/tmp/openclaw-proof/bin:$PATH"
          package_root=/tmp/openclaw-proof/lib/node_modules/openclaw
          openclaw --version > /evidence/openclaw-version.txt
          openclaw --help > /evidence/openclaw-help.txt
          test -s /evidence/openclaw-help.txt
          installed_version="$(cat /evidence/openclaw-version.txt)"
          package_version="$(node -p "require('$package_root/package.json').version")"
          [[ "$installed_version" == *"$package_version"* ]]
          openclaw plugins install npm-pack:/tmp/openclaw-codex.tgz --force > /evidence/codex-install.log 2>&1
          openclaw plugins enable codex > /evidence/codex-enable.log 2>&1
          openclaw plugins list --json | tee /tmp/openclaw-codex-plugins-list.json > /evidence/codex-list.json
          openclaw plugins inspect codex --runtime --json | tee /tmp/openclaw-codex-plugin-inspect.json > /evidence/codex-inspect.json
          node scripts/e2e/lib/codex-npm-plugin-live/assertions.mjs assert-plugin npm-pack:/tmp/openclaw-codex.tgz
          node scripts/e2e/lib/codex-npm-plugin-live/assertions.mjs assert-npm-deps
          SMOKE
      - name: Retain the native package qualification result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arm64-no-model-package-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openclaw-arm64-evidence
          if-no-files-found: ignore
          retention-days: 7
